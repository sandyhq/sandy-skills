name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate specs
        run: pnpm exec openspec validate --all --strict
      - name: Test
        run: >-
          mkdir -p reports &&
          node --test --test-reporter=spec --test-reporter=junit
          --test-reporter-destination=stdout --test-reporter-destination=reports/junit.xml
          'test/*.test.mjs'
      - name: Prove
        if: always()
        run: |
          node bin/sandy-skills.mjs check --junit reports/junit.xml --out reports/releasability.md
          cat reports/releasability.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: releasability-report
          path: reports/
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install from the packed package with npm, pnpm and bun
        run: scripts/smoke-install.sh
